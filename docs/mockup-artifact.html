<title>บ้านสบาย Dorm Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --surface-2:#E8EEF2; --ink:#14202B; --ink-2:#4B5968; --ink-3:#7A8896;
  --line:#D4DCE3; --accent:#1F5F8B; --accent-ink:#FFFFFF; --accent-soft:#DDEAF4;
  --ok:#2A7A4C; --ok-soft:#DDF0E4; --warn:#9A6414; --warn-soft:#F7EBD3; --bad:#B23A2E; --bad-soft:#F6DEDA;
  --meter:#9A6414; --shadow:0 1px 2px rgba(20,32,43,.06),0 8px 24px rgba(20,32,43,.08);
  --f-display:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E151B; --surface:#152029; --surface-2:#1C2934; --ink:#E5ECF2; --ink-2:#A2B2C0; --ink-3:#74879A;
    --line:#293846; --accent:#72AAD8; --accent-ink:#0E151B; --accent-soft:#1B3246;
    --ok:#62C08A; --ok-soft:#173526; --warn:#E3AA4E; --warn-soft:#382A12; --bad:#EA7A6D; --bad-soft:#3D1F1B;
    --meter:#E3AA4E; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151B; --surface:#152029; --surface-2:#1C2934; --ink:#E5ECF2; --ink-2:#A2B2C0; --ink-3:#74879A;
  --line:#293846; --accent:#72AAD8; --accent-ink:#0E151B; --accent-soft:#1B3246;
  --ok:#62C08A; --ok-soft:#173526; --warn:#E3AA4E; --warn-soft:#382A12; --bad:#EA7A6D; --bad-soft:#3D1F1B;
  --meter:#E3AA4E; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;letter-spacing:.01em}
h2{font-size:22px} h3{font-size:16px}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-inline:16px}
.top-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand .plate{font-family:var(--f-display);font-weight:700;background:var(--ink);color:var(--bg);border-radius:6px;padding:2px 8px;font-size:15px;letter-spacing:.04em}
.brand b{font-family:var(--f-display);font-size:17px;font-weight:600}
.mockchip{font-size:11px;border:1px dashed var(--warn);color:var(--warn);border-radius:99px;padding:1px 8px;white-space:nowrap}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--ink-2);font-weight:500;white-space:nowrap}
@media (max-width:600px){.top .seg{flex-wrap:nowrap;overflow-x:auto;width:100%}}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.wrap{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
/* owner shell */
.shell{display:grid;grid-template-columns:210px 1fr;gap:24px;align-items:start}
.side{position:sticky;top:76px;display:flex;flex-direction:column;gap:2px}
.side button{display:flex;justify-content:space-between;align-items:center;text-align:left;border:0;background:transparent;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--ink-2);font-weight:500}
.side button:hover{background:var(--surface-2)}
.side button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side .count{font-family:var(--f-mono);font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:0 7px;color:var(--ink-2)}
.side .who{margin-top:16px;padding:12px;border-top:1px solid var(--line);font-size:12.5px}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .side button{white-space:nowrap}
  .side .who{display:none}
}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.pagehead p{margin:2px 0 0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-b{padding:16px}

.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:99px;padding:1px 9px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--accent-soft);color:var(--accent)}
.p-mute{background:var(--surface-2);color:var(--ink-2)}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:4px}
.kpi .s{font-size:12.5px;color:var(--ink-2)}
.dash{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media (max-width:1060px){.dash{grid-template-columns:1fr}}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:0}
@media (max-width:600px){.steps{grid-template-columns:1fr 1fr;row-gap:16px}}
.steps li{position:relative;padding:0 10px 0 0}
.steps .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px;border:2px solid var(--line);background:var(--surface);position:relative;z-index:1}
.steps li::after{content:"";position:absolute;left:26px;right:0;top:12px;height:2px;background:var(--line)}
.steps li:last-child::after{display:none}
.steps .done .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps .now .dot{border-color:var(--accent);color:var(--accent)}
.steps b{display:block;margin-top:8px;font-weight:600;font-size:13.5px}
.steps small{color:var(--ink-2);font-size:12px;display:block}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.occ{display:grid;gap:12px}
.occ-row{display:grid;grid-template-columns:56px 1fr 90px;gap:10px;align-items:center;font-size:13px}
.attn{list-style:none;margin:0;padding:0}
.attn li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.attn li:first-child{border-top:0;padding-top:0}
.attn .t{flex:1;min-width:0}

/* room map */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 12px;cursor:pointer;font-family:var(--f-display);font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.floor{display:grid;grid-template-columns:54px 1fr;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.floor:first-child{border-top:0}
.floor .fl{font-family:var(--f-display);font-weight:600;color:var(--ink-3);font-size:13px}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}
.room{position:relative;text-align:left;border-radius:8px;padding:6px 8px;cursor:pointer;border:1px solid var(--line);background:var(--surface);min-height:54px}
.room .rn{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.02em}
.room .rt{font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.room.OCCUPIED{background:var(--accent-soft);border-color:transparent}
.room.VACANT{border-style:dashed;background:transparent}
.room.RESERVED{background:var(--warn-soft);border-color:transparent}
.room.MAINTENANCE{background:var(--bad-soft);border-color:transparent}
.room .flag{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%}
.room .flag.bad{background:var(--bad)} .room .flag.warn{background:var(--warn)}
.room:hover{outline:2px solid var(--accent);outline-offset:-1px}

/* tables */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-weight:600;font-size:12px;color:var(--ink-2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
th.grp{text-align:center;border-bottom:1px solid var(--line);color:var(--meter)}
.rd{width:96px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-family:var(--f-mono);text-align:right}
.rd:focus{border-color:var(--accent);background:var(--surface)}
.rd.err{border-color:var(--bad);background:var(--bad-soft)}
.rd.done{border-color:var(--ok)}
.hint{font-size:11.5px;display:block;margin-top:2px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.check{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:13px}

/* kanban */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.col-h{display:flex;justify-content:space-between;font-weight:600;padding:2px 4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .rn{font-family:var(--f-display);font-weight:700}
.card select{border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--bg);font-size:12.5px;width:100%}
.prio-URGENT{box-shadow:inset 3px 0 0 var(--bad)}

/* settings */
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.field{display:grid;gap:4px;margin-bottom:12px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.field input,.field select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--bg);width:100%}
.field .unit{position:relative}
.field .unit input{padding-right:64px}
.field .unit span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--ink-3)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fee{display:grid;grid-template-columns:auto 1fr 110px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.fee input[type=number]{border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--bg);text-align:right;font-family:var(--f-mono);width:100%}
.example{background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:13px}
.example table td{padding:3px 0;border:0}

/* phone */
.phone-stage{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:40px;align-items:start;justify-content:center}
@media (max-width:860px){.phone-stage{grid-template-columns:1fr;justify-items:center}}
.phone{width:100%;max-width:370px;height:740px;border-radius:36px;border:10px solid var(--ink);background:var(--bg);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.liff-bar{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:8px;font-size:13px}
.liff-bar .x{font-size:18px;color:var(--ink-3)}
.liff-bar b{flex:1;text-align:center;font-weight:600}
.pscreen{flex:1;overflow-y:auto;padding:14px;display:grid;gap:12px;align-content:start}
.pnav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface)}
.pnav button{border:0;background:transparent;padding:10px 0 12px;font-size:12px;color:var(--ink-3);cursor:pointer;display:grid;justify-items:center;gap:2px}
.pnav button svg{width:20px;height:20px}
.pnav button[aria-current="page"]{color:var(--accent);font-weight:600}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.bigamt{font-family:var(--f-display);font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.lines{display:grid;gap:6px;font-size:13px}
.lines div{display:flex;justify-content:space-between;gap:8px}
.qr{width:170px;height:170px;margin:10px auto;display:grid;grid-template-columns:repeat(25,1fr);background:#fff;padding:8px;border-radius:8px}
.qr i{background:#111}
.chat{display:grid;gap:10px}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:10px 12px;font-size:13px;max-width:92%}
.bubble .h{font-weight:600;margin-bottom:4px}
.aside-notes{max-width:520px}
.aside-notes h3{margin-bottom:8px}
.aside-notes ul{padding-left:18px;margin:6px 0 18px}
.aside-notes li{margin:4px 0}
.ta{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);width:100%;resize:vertical;min-height:80px}
.psel{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;cursor:pointer;font-size:13px}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* invoice doc */
dialog{border:0;border-radius:14px;padding:0;max-width:min(760px,calc(100vw - 32px));width:100%;background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,18,26,.5)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dlg-b{padding:16px;max-height:75vh;overflow-y:auto;background:var(--surface-2)}
.doc{background:#fff;color:#1a1a1a;padding:28px 30px;border-radius:4px;font-size:13px;min-width:560px}
.doc-wrap{overflow-x:auto}
.doc .dh{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #1a1a1a;padding-bottom:12px;margin-bottom:14px}
.doc .dh h1{font-size:20px}
.doc .dt{text-align:right}
.doc .dt h1{font-size:18px}
.doc .meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;margin-bottom:14px}
.doc table th{background:#f0f0f0;color:#333;border-bottom:1px solid #999}
.doc table td{border-bottom:1px solid #ddd;color:#1a1a1a}
.doc .tot{display:flex;justify-content:space-between;gap:16px;margin-top:10px;align-items:flex-start}
.doc .words{background:#f5f5f5;padding:8px 12px;border-radius:4px;flex:1}
.doc .sum{min-width:220px}
.doc .sum div{display:flex;justify-content:space-between;padding:2px 0}
.doc .sum .g{font-weight:700;font-size:15px;border-top:1px solid #1a1a1a;margin-top:4px;padding-top:6px}
.doc .sign{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:40px;text-align:center}
.doc .sign div{border-top:1px dotted #555;padding-top:6px}
.doc .stamp{display:inline-block;border:2px solid #2A7A4C;color:#2A7A4C;font-weight:700;padding:2px 10px;border-radius:4px;transform:rotate(-6deg);font-family:var(--f-display)}

/* blueprint */
.bp{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:1000px){.bp{grid-template-columns:1fr}}
.flow{margin:0;padding-left:22px}
.flow li{margin:0 0 10px;padding-left:4px}
.flow li::marker{font-family:var(--f-display);font-weight:700;color:var(--accent)}
.mermaid-box{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
pre.mermaid{margin:0;font-size:12px;color:var(--ink-2);white-space:pre}
.stack td:first-child{font-weight:600;white-space:nowrap}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:13.5px;z-index:50;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translate(-50%,8px);opacity:.3}}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand"><span class="plate">บส</span><b>บ้านสบาย เรสซิเดนซ์</b><span class="mockchip">Mockup · ข้อมูลตัวอย่าง</span></div>
    <nav class="seg" aria-label="มุมมองผู้ใช้">
      <button data-role="owner" aria-pressed="true">เจ้าของ · เว็บ</button>
      <button data-role="tenant" aria-pressed="false">ผู้เช่า · LINE</button>
      <button data-role="tech" aria-pressed="false">ช่าง · มือถือ</button>
      <button data-role="bp" aria-pressed="false">โครงสร้างระบบ</button>
    </nav>
  </div>
</header>

<main class="wrap" id="app"></main>
<dialog id="dlg"></dialog>

<script>
/* ============ data ============ */
const TODAY = new Date(2026,8,11);
const TH_M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_MF = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const thDate = d => `${d.getDate()} ${TH_M[d.getMonth()]} ${d.getFullYear()+543}`;
const money = (n,dec=2) => Number(n).toLocaleString('th-TH',{minimumFractionDigits:dec,maximumFractionDigits:dec});
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R = rng(2569); const ri=(a,b)=>Math.floor(R()*(b-a+1))+a; const pick=a=>a[Math.floor(R()*a.length)];

/* ============ billing engine (same rules server will use) ============ */
function utilCharge(cfg,units){
  if(cfg.mode==='FLAT') return {amt:cfg.flat,desc:'เหมาจ่าย'};
  const raw=units*cfg.rate; const amt=Math.max(raw,cfg.min||0);
  return {amt,desc: amt>raw?`ขั้นต่ำ ${money(cfg.min,0)} บาท`:''};
}
function buildLines(room,w0,w1,e0,e1){
  const st=S.settings, L=[];
  L.push({type:'RENT',desc:`ค่าเช่าห้อง (${TYPES[room.type].name})`,qty:1,unit:room.rent,amt:room.rent});
  const wu=w1-w0, eu=e1-e0, wc=utilCharge(st.water,wu), ec=utilCharge(st.elec,eu);
  L.push({type:'WATER',desc:'ค่าน้ำประปา'+(wc.desc?` · ${wc.desc}`:''),prev:st.water.mode==='FLAT'?null:w0,curr:st.water.mode==='FLAT'?null:w1,qty:st.water.mode==='FLAT'?1:wu,unit:st.water.mode==='FLAT'?st.water.flat:st.water.rate,amt:wc.amt});
  L.push({type:'ELECTRIC',desc:'ค่าไฟฟ้า'+(ec.desc?` · ${ec.desc}`:''),prev:st.elec.mode==='FLAT'?null:e0,curr:st.elec.mode==='FLAT'?null:e1,qty:st.elec.mode==='FLAT'?1:eu,unit:st.elec.mode==='FLAT'?st.elec.flat:st.elec.rate,amt:ec.amt});
  st.fees.filter(f=>f.on).forEach(f=>L.push({type:'FEE',desc:f.name,qty:1,unit:f.amount,amt:f.amount}));
  return L;
}
const sumLines=L=>L.reduce((s,l)=>s+l.amt,0);
function lateFee(due){
  const st=S.settings; const days=Math.floor((TODAY-due)/864e5)-st.grace;
  if(days<=0||st.lateMode==='NONE') return {days:Math.max(0,days),amt:0};
  if(st.lateMode==='FIXED') return {days,amt:st.lateAmt};
  return {days,amt:Math.min(days*st.lateAmt,st.lateMax||Infinity)};
}

/* ============ baht text (สำหรับใบเสร็จ) ============ */
function readNum(n,cont){
  const D=['ศูนย์','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'],P=['','สิบ','ร้อย','พัน','หมื่น','แสน'];
  let out=''; if(n>=1e6){out+=readNum(Math.floor(n/1e6))+'ล้าน'; n%=1e6; if(!n) return out; cont=true;}
  const s=String(n),len=s.length;
  for(let i=0;i<len;i++){const d=+s[i],p=len-i-1; if(!d) continue;
    if(p===1&&d===1) out+='สิบ'; else if(p===1&&d===2) out+='ยี่สิบ';
    else if(p===0&&d===1&&(len>1||cont)) out+='เอ็ด'; else out+=D[d]+P[p];}
  return out;
}
function bahtText(v){v=Math.round(v*100)/100;const b=Math.floor(v),s=Math.round((v-b)*100);
  if(!b&&!s) return 'ศูนย์บาทถ้วน'; return (b?readNum(b)+'บาท':'')+(s?readNum(s)+'สตางค์':'ถ้วน');}

function meterRowCalc(r){
  const w=r.w,e=r.e; const wOk=w.curr!=null&&w.curr>=w.prev, eOk=e.curr!=null&&e.curr>=e.prev;
  const total = wOk&&eOk? sumLines(buildLines(r,w.prev,w.curr,e.prev,e.curr)):null;
  const avgW=w.prev-w.aug0, anomaly = wOk && (w.curr-w.prev) > Math.max(10,avgW*2.5);
  return {wOk,eOk,total,anomaly};
}
function meterCell(r,k){
  const m=r[k], c=m.curr, bad=c!=null&&c<m.prev;
  return `<td class="r num faint">${money(m.prev,0)}</td>

   <td class="r num" id="u-${k}-${r.id}">${c!=null&&!bad?money(c-m.prev,0):'—'}</td>`;
}

     ${t.status==='IN_PROGRESS'?`<div class="pcard" style="display:grid;gap:10px"><button class="btn" onclick="toast('ระบบจริง: ถ่ายรูปก่อน/หลังซ่อม')">+ รูปหลังซ่อม</button>
       <div><label class="label" for="tj-cost">ค่าอะไหล่/ค่าใช้จ่าย (บาท)</label><input class="psel" id="tj-cost" type="number" value="0"></div>
       <label class="check"><input type="checkbox" id="tj-charge"> เรียกเก็บกับผู้เช่า (ใส่ในบิลเดือนถัดไป)</label>
       <button class="btn primary" data-act="tstat" data-id="DONE">ซ่อมเสร็จ ปิดงาน</button></div>`:''}`}
  return `<div><div class="faint" style="font-size:12.5px">${thDate(TODAY)}</div><h2 style="font-size:20px">งานของ${ME}</h2></div>
   ${['IN_PROGRESS','ASSIGNED','DONE'].map(s=>{const ts=mine.filter(t=>t.status===s);if(!ts.length)return'';return `<div class="label">${TK_COL[s]} · ${ts.length}</div>`+ts.map(t=>
    `<button class="pcard prio-${t.prio}" style="text-align:left;cursor:pointer;display:grid;gap:4px" data-act="job" data-id="${t.id}" ${s==='DONE'?'disabled':''}>
      <div class="toolbar" style="justify-content:space-between"><b style="font-family:var(--f-display);font-size:17px">${t.room}</b>${pill(PRIO[t.prio])}</div><span>${esc(t.title)}</span><span class="faint" style="font-size:12px">${t.cat} · ${esc(t.time||'')}</span></button>`).join('')}).join('')}`;
}
